[project]
name = "wanderlog-mcp"
version = "1.0.0"
description = "Connect Wanderlog to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Wanderlog API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["wanderlog", "wanderlog api", "wanderlog mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/wanderlog-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=wanderlog"
Source = "https://github.com/cotlet-connect/wanderlog-mcp"

[project.scripts]
wanderlog-mcp = "wanderlog_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"wanderlog_agent.py" = "wanderlog_agent.py"

[tool.hatch.build.targets.sdist]
include = ["wanderlog_agent.py", "README.md", "LICENSE", "mcp.json", "skills", "examples", ".cursor"]
